[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-scan"
version = "2.0.0"
description = "Modern camera controller for dual-camera book scanners"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["Pillow>=11,<13"]
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Pi Scan contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.3", "pytest-cov>=6.0", "pyright>=1.1.390", "ruff>=0.9"]
ui = ["kivy>=2.3.1,<3"]
hardware = ["gpiozero>=2,<3"]

[project.scripts]
pi-scan-sim = "pi_scan.simulator:main"
pi-scan-ui = "pi_scan.ui.kivy_app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pi_scan*"]

[tool.setuptools.data-files]
"share/doc/pi-scan" = ["CHANGELOG.md", "MIGRATION.md", "RELEASE_CHECKLIST.md"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
source = ["pi_scan"]
omit = ["*/pi_scan/__main__.py", "*/pi_scan/ui/kivy_app.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 100
include = ["src/pi_scan/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src/pi_scan"]
exclude = ["src/pi_scan/ui"]
